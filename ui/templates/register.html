{% extends "base.html" %}
{% block title %}Create account — Mini Heroku{% endblock %}
{% block auth %}
<div class="auth-card">
    <div class="auth-logo">⚡</div>
    <h1>Create your account</h1>
    <p class="sub">Start deploying apps in minutes</p>
    {% if error %}
    <div class="card" style="background:var(--danger-soft); border-color:#fecaca; padding:0.7rem 0.9rem; margin-bottom:1rem;">
        <p style="color:#991b1b; font-size:0.82rem; font-weight:600;">{{ error }}</p>
    </div>
    {% endif %}
    <form method="POST" action="/ui/register">
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Minimum 8 characters" required minlength="8" autocomplete="new-password">
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Create account</button>
    </form>
    <p class="muted" style="text-align:center; margin-top:1.2rem; font-size:0.85rem;">
        Already have an account? <a href="/ui/login">Sign in</a>
    </p>
</div>
{% endblock %}
