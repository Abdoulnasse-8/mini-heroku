{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:600px; margin:0 auto;">
    <h2>🚀 Deploy New App</h2>
    <div style="margin-top:1rem;">
        <label style="display:block; margin-bottom:0.3rem; font-size:0.85rem; color:#666;">App Name</label>
        <input type="text" id="app-name" placeholder="my-app" style="width:100%">
    </div>
    <div style="margin-top:1rem;">
        <label style="display:block; margin-bottom:0.3rem; font-size:0.85rem; color:#666;">Git Repo URL</label>
        <input type="text" id="repo-url" placeholder="https://github.com/user/repo" style="width:100%">
    </div>
    <button class="btn btn-primary" style="margin-top:1rem; width:100%; padding:10px;" onclick="deployApp()">Deploy</button>
    <div id="result" style="margin-top:1rem;"></div>
    <script>
    function deployApp() {
        const name = document.getElementById('app-name').value;
        const repo = document.getElementById('repo-url').value;
        document.getElementById('result').innerHTML = '<p style="color:#666">Deploying... this may take a minute.</p>';
        fetch('/ui/deploy', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, repo_url: repo})
        }).then(r => r.json()).then(d => {
            if (d.status === 'deployed') {
                document.getElementById('result').innerHTML =
                    '<p style="color:green">✅ Deployed! <a href="/ui/apps/' + d.app + '">View app</a></p>';
            } else {
                document.getElementById('result').innerHTML =
                    '<p style="color:red">❌ Error: ' + JSON.stringify(d) + '</p>';
            }
        });
    }
    </script>
</div>
{% endblock %}
